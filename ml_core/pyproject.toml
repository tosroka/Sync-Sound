[project]
name = "ml-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "pillow>=12.3.0",
    "ruff>=0.16.9",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`), and isort (`I`)
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# You can add custom isort rules here if needed
# known-first-party = ["my_custom_module"]


